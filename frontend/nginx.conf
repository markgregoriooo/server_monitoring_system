# nginx config for the dashboard container. It hands out static files and
# nothing else — the API and the websocket are the backend's job, routed by the
# proxy in front: ICTU's in production (deployment-guide.md §5), the Cloudflare
# Tunnel when testing (§5B).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version in the Server header or on error pages.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── SPA fallback ──────────────
    # React Router handles /analytics, /privacy, /server-metrics and so on in the browser;
    # there are no such files on disk. Serve index.html for anything that is not a real
    # file, or reloading a page returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a hash in these file names (app-a3f9c1.js), so they can be cached for a
    # year. One directive, to avoid two Cache-Control headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must not be cached: it names the current bundle files.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── Serving the API on this same origin ──────────────────────────────────
    # Uncomment when something in front (ICTU's HTTPS proxy, or the Cloudflare
    # Tunnel) sends ALL traffic to this container on one port. nginx then does
    # the /api + /socket.io split itself, so whoever configures the proxy has
    # one upstream to point at instead of two. `backend` is the compose service
    # name; Docker's internal DNS resolves it.
    #
    # Then build the image with VITE_API_URL set to the PUBLIC ORIGIN, e.g.
    # https://datacenter.cspc.edu.ph — NOT blank. Blank does not mean "this
    # origin": config.ts falls back to <this host>:3001, so the browser would
    # try https://datacenter.cspc.edu.ph:3001, a port nothing publishes, and
    # every request would hang. Blank is correct only for a LAN install opened
    # by IP, where port 3001 really is reachable.
    #
    # X-Forwarded-Proto is PASSED THROUGH, not set from $scheme: TLS ends at the
    # proxy in front, so $scheme here is always "http", and overwriting the
    # front proxy's "https" makes the backend treat every request as plain HTTP
    # (req.secure false → HSTS is never sent).
    #
    # location /api/ {
    #     proxy_pass http://backend:3001;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    #     client_max_body_size 3m;    # report logos are up to 2 MB
    # }
    #
    # Socket.IO needs the two upgrade headers or it silently falls back to
    # long-polling: the dashboard loads and no chart ever updates.
    # location /socket.io/ {
    #     proxy_pass http://backend:3001;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    #     proxy_read_timeout 86400;
    # }
    #
    # Adding a proxy also means adding a hop: raise TRUST_PROXY in
    # backend/.env to match (ICTU proxy → this nginx → backend = 2), or every
    # rate limiter buckets the whole campus into one key. deployment-guide.md §D.5.
}
