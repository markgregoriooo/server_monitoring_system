# nginx config for the dashboard container. It hands out static files and
# nothing else — the API and the websocket are the backend's job, routed by the
# Cloudflare Tunnel (deployment-guide.md §5.1).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version in the Server header or on error pages.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── The SPA fallback. The single most important line here. ──────────────
    # React Router owns /analytics, /privacy, /server-metrics and the rest.
    # Those paths exist only in the browser — there is no /analytics/index.html
    # on disk — so without this, clicking around the app works while RELOADING
    # the page or pasting a link returns nginx's own 404. Serve index.html for
    # anything that is not a real file and let the router sort it out.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames (app-a3f9c1.js), so a changed file is a
    # changed name and a year-long cache can never serve a stale one.
    # One directive, not `expires 1y` plus an add_header — those emit TWO
    # Cache-Control headers, which is legal but ambiguous to read and to debug.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must NOT be cached: it is the file that names the current
    # fingerprinted bundles, so a cached copy pins the browser to the old build
    # after every deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── Serving the API on this same origin ──────────────────────────────────
    # Uncomment when something in front (ICTU's HTTPS proxy, or the Cloudflare
    # Tunnel) sends ALL traffic to this container on one port. nginx then does
    # the /api + /socket.io split itself, so whoever configures the proxy has
    # one upstream to point at instead of two. `backend` is the compose service
    # name; Docker's internal DNS resolves it.
    #
    # ⚠️ Then build the image with VITE_API_URL set to the PUBLIC ORIGIN, e.g.
    # https://monitoring.cspc.edu.ph — NOT blank. Blank does not mean "this
    # origin": config.ts falls back to <this host>:3000, so the browser would
    # try https://monitoring.cspc.edu.ph:3000, a port nothing publishes, and
    # every request would hang. Blank is correct only for a LAN install opened
    # by IP, where port 3000 really is reachable.
    #
    # location /api/ {
    #     proxy_pass http://backend:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    #
    # ⚠️ Socket.IO needs the two upgrade headers or it silently falls back to
    # long-polling: the dashboard loads and no chart ever updates.
    # location /socket.io/ {
    #     proxy_pass http://backend:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_read_timeout 86400;
    # }
    #
    # ⚠️ Adding a proxy also means adding a hop: raise TRUST_PROXY in
    # backend/.env to match, or every rate limiter buckets the whole campus
    # into one key.
}
