# nginx config for the dashboard container. It serves the built dashboard and
# forwards /api + /socket.io to the backend container (bottom of this file), so the
# proxy in front — ICTU's (deployment-guide.md §5) or a Cloudflare Tunnel (§5B) —
# may point everything at this one port.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version in the Server header or on error pages.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── SPA fallback ──────────────
    # React Router handles /analytics, /privacy, /server-metrics and so on in the browser;
    # there are no such files on disk. Serve index.html for anything that is not a real
    # file, or reloading a page returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a hash in these file names (app-a3f9c1.js), so they can be cached for a
    # year. One directive, to avoid two Cache-Control headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must not be cached: it names the current bundle files.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── Serving the API on this same origin ──────────────────────────────────
    # /api and /socket.io are forwarded to the backend container, so the proxy in
    # front (ICTU's, or a Cloudflare Tunnel) can send EVERYTHING to this one port.
    # Without this, a proxy that does exactly that got the dashboard's index.html
    # back for POST /api/auth/google (a 405 from nginx), and sign-in said "Cannot
    # connect to server". A proxy that already splits /api to :3001 itself never
    # reaches these blocks, so both setups work.
    #
    # VITE_API_URL must then be the PUBLIC ORIGIN (https://datacenter.cspc.edu.ph),
    # not blank: blank makes config.ts call <this host>:3001, a port the public
    # hostname does not publish. Blank is right only for a LAN install opened by IP.
    #
    # Docker's DNS, resolved per request through a variable: a literal
    # `proxy_pass http://backend:3001` is resolved once at startup, so nginx would
    # refuse to start whenever the backend container is not up yet, and would keep a
    # stale address after the backend is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3001;

    # X-Forwarded-Proto is PASSED THROUGH, not set from $scheme: TLS ends at the
    # proxy in front, so $scheme here is always "http", and overwriting the
    # front proxy's "https" makes the backend treat every request as plain HTTP
    # (req.secure false → HSTS is never sent).
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 3m;    # report logos are up to 2 MB
    }

    # Socket.IO needs the two upgrade headers or it silently falls back to
    # long-polling: the dashboard loads and no chart ever updates.
    location /socket.io/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400;
    }

    # This nginx is a proxy hop: front proxy → this nginx → backend = 2, which is
    # the TRUST_PROXY default in backend/.env. Raise it if there are more hops in
    # front, or every rate limiter buckets the whole campus into one key.
    # deployment-guide.md §D.5.
}
