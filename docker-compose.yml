# ============================================================================
#  CSPC-ICTU Monitoring System — the whole stack
# ----------------------------------------------------------------------------
#  Four containers on one private network. Each has a fixed container name with a
#  `dc-` (datacenter) prefix so they are easy to spot in `docker ps`; the SERVICE
#  names (db, influxdb, backend, frontend) are unchanged, and are what
#  `docker compose ...` commands and the backend's DB_HOST/INFLUX_URL use.
#
#      dc-db         MariaDB      users, devices, alerts, reports, audit trail
#      dc-influxdb   InfluxDB 2   every time-series (environment, servers, SNMP)
#      dc-backend    this repo    API + Socket.IO + the pollers        :3001
#      dc-frontend   nginx        the built dashboard                  :8080
#
#  First run:
#      cp .env.docker.example .env      # fill it in; compose reads it
#      docker compose up -d --build
#      docker compose logs -f backend
#
#  Day to day:
#      docker compose ps                # what is running, and is it healthy
#      docker compose up -d backend     # after editing backend/.env
#          (not `restart`: env_file is read when a container is created, so
#          restart keeps the old values)
#      docker compose down              # stop everything, keep the data
#      docker compose down -v           # also deletes the volumes = the data
#
#  The HTTPS proxy in front (ICTU's, or cloudflared for testing) is not part of
#  this file; it points at ports 3001 and 8080. See deployment-guide.md §5.
# ============================================================================

services:
  # ── MariaDB ──────────────────────────────────────────────────────────────
  # MariaDB, not MySQL: v13_cspc-ictu-monitoring-system.sql and the alert-rule unique
  # index (persistent generated columns) were tested on MariaDB.
  db:
    image: mariadb:10.11
    container_name: dc-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-cspc-ictu-monitoring-system}
      MARIADB_USER: ${DB_USER:?set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Read only by 02-first-admin.sh, on the first start. Blank = no seed.
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      TZ: ${TZ:-Asia/Manila}
    volumes:
      - db-data:/var/lib/mysql
      # Loaded once, on the first start when the data volume is empty. An existing database
      # is never re-initialised. To start over, delete the volume (`docker compose down -v`).
      - ./v13_cspc-ictu-monitoring-system.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Then, on that same first start: create FIRST_ADMIN_EMAIL as an active admin, since v13
      # has no admin and sign-in needs admin approval. See the script's header.
      - ./ops/docker/first-admin.sh:/docker-entrypoint-initdb.d/02-first-admin.sh:ro
    healthcheck:
      # Checks over TCP (-h 127.0.0.1), not the local socket. During the first start the
      # schema loads on a temporary server with networking off; a socket check would pass
      # against it, and the backend would start just as that server shuts down. Over TCP,
      # "healthy" means the real server is up.
      test: ['CMD-SHELL', 'mariadb-admin ping -h 127.0.0.1 -u root -p"$$MARIADB_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      # Generous: this covers the one-off schema import on first boot, and
      # failures inside the start period do not count against the retries.
      start_period: 90s
    # Not published to the host: nothing outside needs MySQL. Add
    # `ports: ["127.0.0.1:3306:3306"]` temporarily if you need Workbench.

  # ── InfluxDB 2 ───────────────────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7-alpine
    container_name: dc-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-cspc}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?set INFLUX_PASSWORD in .env (min 8 chars)}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-cspc-ictu}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-monitoring}
      # The token the backend authenticates with. Same value on both services,
      # from one line of .env, so they cannot drift apart.
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
      TZ: ${TZ:-Asia/Manila}
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    container_name: dc-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # Everything the app needs other than the database connection: JWT_SECRET,
      # DEVICE_SECRET, Google credentials, SMTP, the encryption keys, all tuning settings.
      - backend/.env
    environment:
      # These override env_file: backend/.env has DB_HOST=localhost, which inside a container
      # is the container itself. `db` and `influxdb` are the service names above.
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cspc-ictu-monitoring-system}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-cspc-ictu}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-monitoring}
      TZ: ${TZ:-Asia/Manila}
      # Fixed to the mount point below, overriding backend/.env. A host path left there would
      # make the backend write inside the container, and the backups would be lost on rebuild.
      # Where the files go on the host is BACKUP_HOST_DIR in the root .env.
      BACKUP_DIR: /app/backups
      BACKUP_OFFSITE_MARKER: /app/backups/.last_offsite_sync
      # Fixed to match `ports:` below, overriding backend/.env. A PORT=3000 left there would
      # make the backend listen on a port nothing is mapped to. (3000 is taken on ICTU's server.)
      PORT: 3001
    ports:
      # Published on all interfaces: the ESP32 and the Go agents connect to this port over
      # the campus LAN, not through the proxy. Firewall it to those subnets.
      - "3001:3001"
    volumes:
      # Named volumes, so the data survives `docker compose down` and rebuilds.
      #
      # backups can be a host folder instead: set BACKUP_HOST_DIR in the root .env (e.g.
      # /mnt/backup/backups, the USB drive). Production should: a named volume is on the same
      # disk as the database, and the nightly dump and Backblaze upload
      # (ops/backup-setup-linux.md) need a real path. The folder must be writable by uid 1000
      # (the image's `node` user).
      - ${BACKUP_HOST_DIR:-backend-backups}:/app/backups
      - backend-reports:/app/reports
      - backend-branding:/app/branding
    depends_on:
      # Wait until healthy, not just started, so the first boot does not log a wall of
      # connection errors.
      db:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # ── Dashboard ────────────────────────────────────────────────────────────
  frontend:
    container_name: dc-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Build args, not runtime env: Vite builds these into the JS, so changing either needs
        # `docker compose up -d --build frontend`. VITE_API_URL is the public address (no port)
        # when a proxy is in front; blank for a plain LAN install.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?set VITE_GOOGLE_CLIENT_ID in .env}
        # Branding. The defaults are the CSPC values; they are here so another institution can
        # rebrand without code changes.
        VITE_APP_NAME: ${VITE_APP_NAME:-CSPC-ICTU}
        VITE_APP_FULL_NAME: ${VITE_APP_FULL_NAME:-Camarines Sur Polytechnic Colleges – Information and Communications Technology Unit}
        VITE_APP_SUBTITLE: ${VITE_APP_SUBTITLE:-MONITORING}
        VITE_APP_TAGLINE: ${VITE_APP_TAGLINE:-SERVER INFRASTRUCTURE MONITORING SYSTEM}
        VITE_LOGO_TEXT: ${VITE_LOGO_TEXT:-CC}
        VITE_LOGO_SRC: ${VITE_LOGO_SRC:-/logo-128.png}
    restart: unless-stopped
    ports:
      # 8080 because that is what the tunnel's catch-all rule already points at
      # (cloudflare-tunnel-setup.md ingress).
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
  influx-data:
  influx-config:
  backend-backups:
  backend-reports:
  backend-branding:
