<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Disk-full ETA — linear regression example</title>
<style>
  :root{
    --gf-bg:#111217; --gf-panel:#181B1F; --gf-border:rgba(255,255,255,.07);
    --gf-text:#D9D9D9; --gf-muted:#6B7280; --gf-dim:#4B5563;
    --gf-accent:#5794F2; --gf-green:#73BF69; --gf-danger:#F2495C; --gf-orange:#FF780A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--gf-bg);color:var(--gf-text);
       font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;padding:24px}
  .panel{background:var(--gf-panel);border:1px solid var(--gf-border);border-radius:2px;
         padding:18px 20px;max-width:880px;margin:0 auto}
  h1{font-size:16px;font-weight:600;margin:0 0 2px}
  .sub{color:var(--gf-muted);font-size:12px;margin:0 0 16px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
  .stat{background:#111217;border:1px solid var(--gf-border);border-radius:2px;padding:8px 12px;min-width:120px}
  .stat .k{color:var(--gf-muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
  .stat .v{font-size:15px;margin-top:2px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--gf-muted);font-size:11px;margin-top:10px}
  .legend i{display:inline-block;width:14px;height:0;vertical-align:middle;margin-right:6px}
  text{font-family:inherit}
  .grid{stroke:var(--gf-border)}
  .axis{stroke:var(--gf-dim)}
  .axislbl{fill:var(--gf-muted);font-size:10px}
  .formula{color:var(--gf-muted);font-size:11px;margin-top:14px;line-height:1.6}
  .formula b{color:var(--gf-text)}
</style>
</head>
<body>
<div class="panel">
  <h1>Disk-full ETA — simple linear regression</h1>
  <p class="sub">x = hours since first sample &nbsp;•&nbsp; y = disk_percent &nbsp;•&nbsp; same OLS math as <code>analyticsService.js</code></p>
  <svg id="chart" width="840" height="440" role="img"></svg>
  <div class="legend">
    <span><i style="border-top:2px solid var(--gf-accent)"></i>actual readings (hourly)</span>
    <span><i style="border-top:2px solid var(--gf-green)"></i>fitted line ŷ = m·x + b</span>
    <span><i style="border-top:2px dashed var(--gf-orange)"></i>projection</span>
    <span><i style="border-top:2px solid var(--gf-danger)"></i>full (100%) → ETA</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="formula" id="formula"></div>
</div>

<script>
// ── the SAME regression used in backend/services/analyticsService.js ─────────────
function linearRegression(points){
  const n = points.length; if(n<2) return null;
  let sx=0, sy=0; for(const p of points){ sx+=p.x; sy+=p.y; }
  const xb=sx/n, yb=sy/n;
  let num=0, den=0; for(const p of points){ num+=(p.x-xb)*(p.y-yb); den+=(p.x-xb)**2; }
  if(den===0) return null;
  const slope=num/den, intercept=yb-slope*xb;
  let ssRes=0, ssTot=0, absErr=0;
  for(const p of points){ const yhat=slope*p.x+intercept;
    ssRes+=(p.y-yhat)**2; ssTot+=(p.y-yb)**2; absErr+=Math.abs(p.y-yhat); }
  const r2 = ssTot===0?1:1-ssRes/ssTot;
  return { slope, intercept, r2, mae:absErr/n };
}

// ── synthetic hourly disk_percent: 14-day window, true slope ≈ 2.44 %/day ────────
// seeded RNG so the picture is stable
let seed=42; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
const gauss=()=>{ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };

const LOOKBACK_H = 14*24;          // 336 hours = 14 days of history
const TRUE_M = 22/216;             // %/hour  → from 43.8% to 78% over 14 days
const TRUE_B = 43.8;
const FULL = 100;
const points=[];
for(let h=0; h<=LOOKBACK_H; h+=1){            // one reading per hour
  const y = TRUE_B + TRUE_M*h + gauss()*1.6;  // trend + measurement noise
  points.push({ x:h, y:Math.max(0,Math.min(100,y)) });
}

const model = linearRegression(points);
const nowX   = points[points.length-1].x;
const nowY   = model.slope*nowX + model.intercept;
const xFull  = (FULL - model.intercept) / model.slope;   // solve 100 = m·x + b
const etaH   = xFull - nowX;
const etaD   = etaH/24;
const fullDate = new Date(Date.now() + etaH*3600*1000);

// ── plot ─────────────────────────────────────────────────────────────────────
const W=840,H=440, m={l:54,r:20,t:18,b:42};
const xMin=0, xMax=Math.ceil(xFull/24)*24;       // pad x out past the ETA
const yMin=40, yMax=104;
const px = x => m.l + (x-xMin)/(xMax-xMin)*(W-m.l-m.r);
const py = y => H-m.b - (y-yMin)/(yMax-yMin)*(H-m.t-m.b);
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('chart');
const el=(t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a)e.setAttribute(k,a[k]); return e; };

// y gridlines + labels
for(let y=40;y<=100;y+=10){
  svg.appendChild(el('line',{x1:m.l,y1:py(y),x2:W-m.r,y2:py(y),class:'grid'}));
  const t=el('text',{x:m.l-8,y:py(y)+3,'text-anchor':'end',class:'axislbl'}); t.textContent=y+'%'; svg.appendChild(t);
}
// x gridlines + labels (per day)
for(let d=0; d<=xMax/24; d+=2){
  const X=px(d*24);
  svg.appendChild(el('line',{x1:X,y1:m.t,x2:X,y2:H-m.b,class:'grid'}));
  const t=el('text',{x:X,y:H-m.b+16,'text-anchor':'middle',class:'axislbl'}); t.textContent='d'+d; svg.appendChild(t);
}
svg.appendChild(el('text',{x:(m.l+W-m.r)/2,y:H-6,'text-anchor':'middle',class:'axislbl'}).appendChild(document.createTextNode('x = days since first sample (model uses hours)'))?svg.lastChild:null);
const yl=el('text',{x:14,y:(m.t+H-m.b)/2,'text-anchor':'middle',class:'axislbl',transform:`rotate(-90 14 ${(m.t+H-m.b)/2})`}); yl.textContent='y = disk_percent'; svg.appendChild(yl);

// 100% danger line
svg.appendChild(el('line',{x1:m.l,y1:py(100),x2:W-m.r,y2:py(100),stroke:'var(--gf-danger)','stroke-width':1,'stroke-dasharray':'2 3',opacity:.6}));

// scatter (actual readings) — thin out so it's readable
for(let i=0;i<points.length;i+=3){
  svg.appendChild(el('circle',{cx:px(points[i].x),cy:py(points[i].y),r:1.7,fill:'var(--gf-accent)',opacity:.55}));
}

// fitted line over the OBSERVED range (solid green)
svg.appendChild(el('line',{x1:px(xMin),y1:py(model.slope*xMin+model.intercept),
  x2:px(nowX),y2:py(nowY),stroke:'var(--gf-green)','stroke-width':2}));

// projection beyond "now" to 100% (dashed orange)
svg.appendChild(el('line',{x1:px(nowX),y1:py(nowY),x2:px(xFull),y2:py(100),
  stroke:'var(--gf-orange)','stroke-width':2,'stroke-dasharray':'6 5'}));

// "now" marker
svg.appendChild(el('line',{x1:px(nowX),y1:m.t,x2:px(nowX),y2:H-m.b,stroke:'var(--gf-muted)','stroke-width':1,'stroke-dasharray':'2 4',opacity:.5}));
svg.appendChild(el('circle',{cx:px(nowX),cy:py(nowY),r:4,fill:'var(--gf-green)'}));
let tn=el('text',{x:px(nowX)+6,y:py(nowY)-8,class:'axislbl',fill:'var(--gf-text)'}); tn.textContent='now '+nowY.toFixed(1)+'%'; svg.appendChild(tn);

// ETA marker at 100%
svg.appendChild(el('circle',{cx:px(xFull),cy:py(100),r:5,fill:'var(--gf-danger)'}));
let te=el('text',{x:px(xFull)-6,y:py(100)-9,'text-anchor':'end',class:'axislbl',fill:'var(--gf-danger)'});
te.textContent='full in ~'+etaD.toFixed(1)+' days'; svg.appendChild(te);

// ── stats + formula ──────────────────────────────────────────────────────────
const conf = model.r2>=0.7?'high':model.r2>=0.4?'medium':'low';
document.getElementById('stats').innerHTML = [
  ['current disk', nowY.toFixed(1)+'%'],
  ['slope (m)', (model.slope*24).toFixed(2)+' %/day'],
  ['ETA', '~'+etaD.toFixed(1)+' days'],
  ['full by', fullDate.toISOString().slice(0,10)],
  ['R²', model.r2.toFixed(3)+' ('+conf+')'],
  ['MAE', model.mae.toFixed(2)+'%'],
  ['samples', points.length],
].map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

document.getElementById('formula').innerHTML =
  `Fit: <b>ŷ = ${model.slope.toFixed(4)}·x + ${model.intercept.toFixed(2)}</b> &nbsp;(x in hours)<br>`+
  `Solve <b>100 = m·x + b</b> → x_full = (100 − ${model.intercept.toFixed(2)}) / ${model.slope.toFixed(4)} = `+
  `<b>${xFull.toFixed(0)} h</b><br>`+
  `ETA = x_full − x_now = ${xFull.toFixed(0)} − ${nowX} = <b>${etaH.toFixed(0)} h ≈ ${etaD.toFixed(1)} days</b> `+
  `&nbsp;→ surfaced because R² ${model.r2.toFixed(2)} ≥ 0.40 gate and horizon ≤ 365 days.`;
</script>
</body>
</html>
